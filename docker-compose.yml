services:
  api:
    build:
      context: .
      target: api
    environment:
      PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  verify:
    build:
      context: .
      target: verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    restart: "no"
